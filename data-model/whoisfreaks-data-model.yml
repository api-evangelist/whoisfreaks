summary: >-
  WhoisFreaks has no persistent, addressable resources — there are no ids, no
  create/update/delete verbs and nothing to relate across calls. The data model
  is therefore a lookup model, not an entity model: seven independent response
  trees (WHOIS, DNS, SSL, Geolocation, IP Reputation, Domain Reputation, IP/ASN
  WHOIS) each rooted at a query subject (a domain, an IP, or an ASN) and
  composed of embedded value objects. Every "relationship" below is schema
  composition via $ref, not a foreign key.
subjects:
  - name: domain
    description: A registrable domain name — the query key for WHOIS, DNS, SSL, subdomains, availability, typosquatting and domain reputation.
    id_field: domain_name / domainName (naming varies by family)
  - name: ip
    description: An IPv4 or IPv6 address — the query key for geolocation, IP reputation, IP WHOIS and reverse DNS.
  - name: asn
    description: An Autonomous System Number — the query key for ASN WHOIS.
