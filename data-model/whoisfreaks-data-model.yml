gaps:
  - No resource identifiers, no ETags, no created/updated metadata on responses.
  - Field naming is inconsistent across families (domain_name vs domainName,
    total_pages vs totalPages).
  - ErrorResponse.status is deliberately untyped because the value is an
    integer, boolean or string depending on the endpoint.
