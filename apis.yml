- name: WhoisFreaks MCP Server
  description: >-
    Official open-source Model Context Protocol server (Java) exposing 14 WhoisFreaks domain-intelligence
    tools to MCP-compatible AI clients. Distributed as source and as the whoisfreaks/mcp-server Docker
    image; runs over stdio locally or HTTP/SSE on port 3100 when self-hosted. No vendor-hosted public
    MCP endpoint.
  humanURL: https://github.com/WhoisFreaks/whoisfreaks-mcp-server
