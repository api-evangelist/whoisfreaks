name: WhoisFreaks
description: >-
  WhoisFreaks is a domain and IP intelligence provider whose REST API suite covers live WHOIS, historical WHOIS,
  bulk and reverse WHOIS, IP and ASN WHOIS, live/historical/reverse DNS, domain availability with suggestions,
  typosquatting discovery, SSL certificate lookup, subdomain enumeration, IP geolocation, IP reputation and
  domain reputation. Alongside the live lookup APIs it ships bulk downloadable databases (WHOIS, DNS, subdomains,
  IP geolocation, IP security, ASN, newly registered domains, expiring and dropped domains, and daily
  phishing/malware/spam threat feeds), brand/domain/registrant monitoring services with email, Telegram and
  webhook alerts, ten officially maintained OpenAPI-generated SDKs, a Go CLI, an n8n community node, and an
  open-source MCP server exposing fourteen domain-intelligence tools to AI assistants. Authentication is a single
  apiKey query parameter across every endpoint.
image: https://whoisfreaks.com/images/logo.png
url: https://raw.githubusercontent.com/api-evangelist/whoisfreaks/refs/heads/main/apis.yml
