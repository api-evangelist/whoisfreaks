summary: >-
  The WhoisFreaks MCP server is a thin, hand-curated projection of the live
  lookup half of the REST API. Every one of its 14 tools binds cleanly to a
  single REST operationId — there are no MCP-only composites — but the MCP
  surface covers only 14 of the 60 published operations. The entire bulk
  database, threat-feed, and account-utility surface (32 download/status
  operations plus 2 account operations) has no agent-facing tool, and neither do
  any of the bulk POST endpoints.
